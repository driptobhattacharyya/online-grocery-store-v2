# One-click deploy on Render: New + > Blueprint > pick this repo.
services:
  - type: web
    name: grocery-store
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false   # set this in the Render dashboard (min. 8 chars, not "password")
      - key: LOG_LEVEL
        value: INFO
      # Render puts one proxy in front of the service.
      - key: TRUSTED_PROXY_COUNT
        value: "1"

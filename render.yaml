# One-click deploy on Render: New + > Blueprint > pick this repo.
services:
  - type: web
    name: grocery-store
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false   # set this in the Render dashboard
